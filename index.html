<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset 360 — MRDC HTRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1E2B5E; --ink:#0E1C33; --line:#e4e7ef; --muted:#6b7488; --bg:#f5f6fa;
    --wine:#8A2D5B; --blue:#1B4F8A; --amber:#B8860B; --bad:#A32D2D; --good:#1BAF7A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#15181f;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5}
  a{color:var(--blue)}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  /* header */
  .hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:0 1px 2px rgba(20,25,40,.04)}
  .hero h1{margin:0 0 4px;font-size:22px;color:var(--ink);font-weight:700}
  .hero .sub{font-size:13.5px;color:var(--muted)}
  .badge{display:inline-block;background:#eef2fb;color:var(--navy);border:1px solid #d7e0f2;border-radius:99px;padding:2px 11px;font-size:12px;font-weight:600;vertical-align:middle;margin-left:8px}
  dl.facts{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;margin:16px 0 0;font-size:13.5px}
  dl.facts dt{color:var(--muted);font-weight:600}
  dl.facts dd{margin:0}
  .herorow{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
  .heromain{flex:1 1 320px;min-width:0}
  .assetphoto{flex:0 0 auto}
  .assetphoto img{max-width:280px;max-height:210px;border-radius:9px;border:1px solid var(--line);object-fit:cover;cursor:zoom-in;display:block}
  /* sections */
  .sec{margin-top:26px}
  .sec h2{font-size:15px;color:var(--ink);margin:0 0 10px;display:flex;align-items:center;gap:9px}
  .cnt{background:var(--navy);color:#fff;border-radius:99px;font-size:12px;font-weight:600;padding:1px 9px;min-width:22px;text-align:center}
  .card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:9px;box-shadow:0 1px 2px rgba(20,25,40,.03)}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .card .id{font-weight:700;font-size:15px}
  .card .id a{text-decoration:none}
  .card .meta{color:var(--muted);font-size:13px;margin-top:3px}
  .card .desc{margin-top:6px;font-size:13px}
  .pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .p-open{background:#E7EFFA;color:#1B4F8A}.p-closed{background:#E7F6EF;color:#0F7A4E}
  .p-crit{background:#FBE9E9;color:#A32D2D}.p-warn{background:#FDF0DD;color:#8A5B00}
  .overdue{color:var(--bad);font-weight:600}
  .empty{color:var(--muted);font-style:italic;padding:6px 2px}
  .err{background:#FBE9E9;border:1px solid #f0cccc;color:#7d2020;border-radius:10px;padding:10px 12px;font-size:13px}
  .pickwrap{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 22px;text-align:center}
  .pickwrap input{width:100%;max-width:460px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;margin-top:12px}
  .openlink{font-size:12.5px;font-weight:600;text-decoration:none}
  .spin{color:var(--muted);padding:14px 2px}
  /* chooser filters */
  .pickctrls{display:flex;gap:10px;max-width:560px;margin:14px auto 0}
  .pickctrls .sel{flex:0 0 auto;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:#15181f}
  .pickctrls input{flex:1 1 auto;margin-top:0;max-width:none}
  .results{max-width:560px;margin:14px auto 0;text-align:left;max-height:60vh;overflow:auto}
  .rrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;text-decoration:none;color:#15181f;background:#fff}
  .rrow:hover{border-color:var(--navy);background:#f7f9fe}
  .rrow .rid{font-weight:700;font-size:13.5px;flex:0 0 auto}
  .rrow .rname{color:var(--muted);font-size:13px;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rrow .badge{margin-left:0}
  /* per-asset filter bar */
  .filterbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}
  .fgroup{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
  .fbtn{appearance:none;border:0;border-right:1px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;padding:7px 14px;cursor:pointer}
  .fbtn:last-child{border-right:0}
  .fbtn.active{background:var(--navy);color:#fff}
  .filterbar .sel{padding:7px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;font-weight:600;background:#fff;color:#15181f}
</style>
</head>
<body>
<div class="wrap">
  <div id="root"><div class="spin">Loading…</div></div>
</div>

<script>
const ASSET_BASE = 'app0sXrUbOBr7a6vV', ASSET_TABLE_ID = 'tbll88se1AcceHDhW';
const NC_API  = 'https://nc.mrdc-htra.com/api/ncs';
const DMT_API = 'https://dmt.mrdc-htra.com/api/work-orders';
const NC_APP  = 'https://nc.mrdc-htra.com';
const DMT_APP = 'https://dmt.mrdc-htra.com';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const root = $('#root');
const qs = new URLSearchParams(location.search);
const ASSET_ID = (qs.get('id') || '').trim();
const today = new Date().toISOString().slice(0,10);

const TERMINAL_NC  = ['Closed','Cancelled'];
const TERMINAL_DMT = ['Resolved','Verified','Closed','Cancelled'];
const ncOpen  = s => !TERMINAL_NC.includes(s || 'New');
const dmtOpen = s => !TERMINAL_DMT.includes(s || 'New');

function statusPill(status, open){
  const cls = open ? 'p-open' : 'p-closed';
  return `<span class="pill ${cls}">${esc(status || 'New')}</span>`;
}
function prioPill(p){
  if(!p) return '';
  const cls = p === 'Critical' ? 'p-crit' : (p === 'Important' || p === 'High') ? 'p-warn' : 'p-open';
  return ` <span class="pill ${cls}">${esc(p)}</span>`;
}
function dueBit(due, open){
  if(!due) return '';
  const od = open && due < today;
  return ` · <span class="${od?'overdue':''}">Due ${esc(due)}${od?' — overdue':''}</span>`;
}

async function getJSON(url){
  const r = await fetch(url, { headers:{ 'Accept':'application/json' } });
  if(!r.ok) throw new Error(url + ' → ' + r.status);
  return r.json();
}

// ---- no id: asset chooser (filter by asset type + search) ----
async function renderChooser(){
  root.innerHTML = `<div class="pickwrap">
    <h1 style="margin:0;font-size:20px;color:var(--ink)">Asset 360</h1>
    <div class="muted small" style="margin-top:6px">Pick an asset to see everything recorded against it — non-conformances, DMT work orders and more.</div>
    <div class="pickctrls">
      <select id="cat" class="sel" aria-label="Filter by asset type"><option value="">All types</option></select>
      <input id="pick" placeholder="Search asset ID or name…" autocomplete="off">
    </div>
    <div id="results" class="results"><div class="spin">Loading assets…</div></div>
  </div>`;
  const resultsEl = $('#results');
  try{
    const list = await getJSON('/api/assets?all=1');
    // asset types with counts, for the filter dropdown
    const tally = {};
    list.forEach(a => { const k = a.category || '—'; tally[k] = (tally[k]||0)+1; });
    const cats = Object.keys(tally).sort((x,y)=>x.localeCompare(y));
    const sel = $('#cat');
    sel.innerHTML = `<option value="">All types (${list.length})</option>` +
      cats.map(c => `<option value="${esc(c)}">${esc(c)} (${tally[c]})</option>`).join('');
    const pick = $('#pick');
    function render(){
      const cat = sel.value;
      const query = pick.value.trim().toLowerCase();
      // Keep the results area empty until the user searches or picks an asset type.
      if(!cat && !query){ resultsEl.innerHTML = `<div class="empty">Search by asset ID or name, or pick an asset type to list assets.</div>`; return; }
      let rows = list;
      if(cat) rows = rows.filter(a => (a.category || '—') === cat);
      if(query) rows = rows.filter(a => (String(a.id) + ' ' + (a.name || '')).toLowerCase().includes(query));
      rows = rows.slice().sort((a,b)=> String(a.name || a.id).localeCompare(String(b.name || b.id)));
      const shown = rows.slice(0, 200);
      resultsEl.innerHTML = rows.length
        ? shown.map(a => `<a class="rrow" href="?id=${encodeURIComponent(a.id)}"><span class="rid">${esc(a.id)}</span><span class="rname">${esc(a.name || '')}</span>${a.category?`<span class="badge">${esc(a.category)}</span>`:''}</a>`).join('')
          + (rows.length > shown.length ? `<div class="muted small" style="padding:8px 2px">Showing ${shown.length} of ${rows.length} — narrow with the search box.</div>` : `<div class="muted small" style="padding:8px 2px">${rows.length} asset${rows.length===1?'':'s'}.</div>`)
        : `<div class="empty">No assets match this filter.</div>`;
    }
    sel.addEventListener('change', render);
    pick.addEventListener('input', render);
    render();
  }catch(e){
    resultsEl.innerHTML = `<div class="err">Couldn't load the asset register (${esc(e.message)}).</div>`;
  }
}

// ---- asset header ----
function renderHero(a){
  const routeLabel = a.route ? (/^\d/.test(String(a.route)) ? `Route ${esc(a.route)}` : esc(a.route)) : '';
  const loc = [routeLabel, (a.km!=null && a.km!=='') ? `km ${esc(a.km)}` : ''].filter(Boolean).join(' · ');
  const gps = (a.lat!=null && a.lng!=null) ? `<a href="https://www.google.com/maps?q=${a.lat},${a.lng}" target="_blank" rel="noopener">${a.lat}, ${a.lng}</a>` : '<span class="muted">—</span>';
  const airtable = a.recId ? `https://airtable.com/${ASSET_BASE}/${ASSET_TABLE_ID}/${a.recId}` : '';
  const photo = a.photo
    ? `<div class="assetphoto"><a href="${esc(a.photo)}" target="_blank" rel="noopener" title="Open full size"><img src="${esc(a.photo)}" alt="${esc(a.name || a.id)}" onerror="this.closest('.assetphoto').style.display='none'"></a></div>`
    : '';
  return `<div class="hero"><div class="herorow">
    <div class="heromain">
      <h1>${esc(a.name || a.id)}${a.category?`<span class="badge">${esc(a.category)}</span>`:''}</h1>
      <div class="sub">${esc(a.id)}</div>
      <dl class="facts">
        <dt>Location</dt><dd>${loc || '<span class="muted">—</span>'}</dd>
        <dt>GPS</dt><dd>${gps}</dd>
        ${airtable?`<dt>Record</dt><dd><a href="${airtable}" target="_blank" rel="noopener" class="openlink">Open in Airtable ↗</a></dd>`:''}
      </dl>
    </div>
    ${photo}
  </div></div>`;
}

function ncCard(n){
  const open = ncOpen(n.Status);
  const link = `${NC_APP}/?nc=${encodeURIComponent(n['NC #']||'')}`;
  const line2 = [n['Notice Type'], n['Standard / Clause'], n['Responsible Person']?('Owner: '+n['Responsible Person']):''].filter(Boolean).map(esc).join(' · ');
  const desc = n.Description ? String(n.Description).slice(0,160) : '';
  return `<div class="card">
    <div class="top">
      <div class="id"><a href="${link}" target="_blank" rel="noopener">${esc(n['NC #']||'NC')}</a></div>
      <div>${statusPill(n.Status, open)}</div>
    </div>
    <div class="meta">${line2 || ''}${n['Date Raised']?` · Issued ${esc(n['Date Raised'])}`:''}${dueBit(n['Due Date'], open)}</div>
    ${desc?`<div class="desc">${esc(desc)}${String(n.Description).length>160?'…':''}</div>`:''}
  </div>`;
}

function dmtCard(w){
  const open = dmtOpen(w.Status);
  const link = `${DMT_APP}/?wo=${encodeURIComponent(w['Work Order #']||'')}`;
  const std = [w.Standard, w['Standard Title']].filter(Boolean).join(' — ');
  const line2 = [std, w.Finding].filter(Boolean).map(esc).join(' · ');
  const desc = w.Description ? String(w.Description).slice(0,160) : '';
  return `<div class="card">
    <div class="top">
      <div class="id"><a href="${link}" target="_blank" rel="noopener">${esc(w['Work Order #']||'WO')}</a></div>
      <div>${statusPill(w.Status, open)}${prioPill(w.Priority)}</div>
    </div>
    <div class="meta">${line2 || ''}${w['Date Observed']?` · Observed ${esc(w['Date Observed'])}`:''}${dueBit(w['Due Date'], open)}</div>
    ${desc?`<div class="desc">${esc(desc)}${String(w.Description).length>160?'…':''}</div>`:''}
  </div>`;
}

function byDateDesc(arr, field){
  return arr.slice().sort((a,b)=> String(b[field]||'').localeCompare(String(a[field]||'')));
}

// ---- per-asset section state + filtering (status + WO priority) ----
const SECT = { nc: { rows: null, err: null }, dmt: { rows: null, err: null } };

function activeStatus(){
  const b = document.querySelector('.fbtn.active');
  return b ? b.dataset.status : 'all';
}
function passStatus(open, status){
  if(status === 'open')   return open;
  if(status === 'closed') return !open;
  return true;
}
function paintSection(kind, card, openFn, extraPred, emptyMsg){
  const listEl = $('#'+kind+'-list'), cntEl = $('#'+kind+'-cnt');
  if(!listEl) return;
  const st = SECT[kind];
  if(st.err){ listEl.innerHTML = `<div class="err">${esc(st.err)}</div>`; if(cntEl) cntEl.textContent = '!'; return; }
  if(!st.rows) return;                       // still loading — keep the spinner
  const status = activeStatus();
  const rows = st.rows.filter(r => passStatus(openFn(r.Status), status) && extraPred(r));
  if(cntEl) cntEl.textContent = rows.length === st.rows.length ? String(st.rows.length) : `${rows.length}/${st.rows.length}`;
  listEl.innerHTML = rows.length ? rows.map(card).join('') : `<div class="empty">${emptyMsg}</div>`;
}
function applyFilters(){
  const prio = ($('#prio') || {}).value || '';
  paintSection('nc', ncCard, ncOpen, () => true, 'No non-conformances match these filters.');
  paintSection('dmt', dmtCard, dmtOpen, w => !prio || String(w.Priority || '') === prio, 'No DMT work orders match these filters.');
}

async function loadSection(kind){
  try{
    if(kind === 'nc'){
      const j = await getJSON(`${NC_API}?asset=${encodeURIComponent(ASSET_ID)}&limit=500`);
      SECT.nc = { rows: byDateDesc(j.records || [], 'Date Raised'), err: null };
    } else {
      const j = await getJSON(`${DMT_API}?asset=${encodeURIComponent(ASSET_ID)}&limit=500`);
      SECT.dmt = { rows: byDateDesc(j.records || [], 'Date Observed'), err: null };
    }
  }catch(e){
    SECT[kind] = { rows: null, err: `Couldn't load this section (${e.message}). If this persists right after deploy, the API may still need its CORS/redeploy.` };
  }
}

function filterBar(){
  return `<div class="filterbar">
    <div class="fgroup" role="group" aria-label="Status">
      <button class="fbtn active" data-status="all">All</button>
      <button class="fbtn" data-status="open">Open</button>
      <button class="fbtn" data-status="closed">Closed</button>
    </div>
    <select id="prio" class="sel" aria-label="Work-order priority">
      <option value="">All priorities</option>
      <option value="Critical">Critical</option>
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
  </div>`;
}

async function renderAsset(){
  let a = null;
  try{ a = await getJSON('/api/assets?id=' + encodeURIComponent(ASSET_ID) + '&all=1'); }
  catch(e){ a = null; }
  const heroHtml = a ? renderHero(a)
    : `<div class="hero"><h1>${esc(ASSET_ID)}</h1><div class="sub err" style="margin-top:8px">This asset ID was not found in the register. Records below are still matched by the exact ID.</div></div>`;

  root.innerHTML = `<div style="margin:0 0 14px"><a href="${location.pathname}" style="text-decoration:none;font-weight:600;font-size:13px;color:var(--blue)">← All assets</a></div>` + heroHtml + filterBar() +
    `<div class="sec"><h2>Non-conformances <span class="cnt" id="nc-cnt">…</span></h2><div id="nc-list"><div class="spin">Loading…</div></div></div>` +
    `<div class="sec"><h2>DMT work orders <span class="cnt" id="dmt-cnt">…</span></h2><div id="dmt-list"><div class="spin">Loading…</div></div></div>`;

  // wire the filter controls
  document.querySelectorAll('.fbtn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.fbtn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    applyFilters();
  }));
  const prioSel = $('#prio'); if(prioSel) prioSel.addEventListener('change', applyFilters);

  // load both sections; paint each as soon as it arrives
  await Promise.all([
    loadSection('nc').then(applyFilters),
    loadSection('dmt').then(applyFilters),
  ]);
  applyFilters();
}

(ASSET_ID ? renderAsset() : renderChooser());
</script>
<script src="https://www.mrdc-htra.com/app-switcher.js"></script>
</body>
</html>
